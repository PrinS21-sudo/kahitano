<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
 
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
 
        .page-shell {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 32px 16px 48px;
        }
 
        .container { text-align: center; }
 
        .player-panel {
            width: min(420px, 90vw);
            margin: 0 auto 18px;
            padding: 16px;
            border-radius: 12px;
        }
 
        .nickname-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
 
        input {
            width: 220px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
 
        .difficulty-control {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            text-align: left;
        }
 
        .difficulty-control select {
            min-width: 132px;
            padding: 9px 12px;
            border-radius: 8px;
            font: inherit;
        }
 
        h1 { margin: 10px; font-size: clamp(2.6rem, 7vw, 4.5rem); }
 
        /* ---------- game area ---------- */
        #game {
            position: relative;
            width: 400px;
            height: 600px;
            margin: 0 auto;
            overflow: hidden;
            border: 4px solid #526d9b;
            border-radius: 8px;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
 
        #stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
 
        /* start + game-over card (colours come from game-themes.css) */
        #message {
            position: absolute;
            top: 50%;
            left: 28px;
            right: 28px;
            transform: translateY(-50%);
            padding: 22px 20px 20px;
            z-index: 20;
            text-align: center;
            animation: cardIn .45s cubic-bezier(.2, .9, .25, 1) both;
        }
 
        #message h2 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -.02em; }
        #message p { margin: 0 0 14px; line-height: 1.5; font-size: .95rem; }
        #message .hint { margin: 10px 0 0; font-size: .78rem; opacity: .7; }
        #message .newbest { margin: 0 0 12px; font-weight: 700; color: #e8a21d; letter-spacing: .04em; text-transform: uppercase; font-size: .8rem; }
 
        .result-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
            margin: 4px 0 14px;
        }
 
        .result span { display: block; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; opacity: .65; }
        .result b { font-size: 2.2rem; line-height: 1.1; font-weight: 700; }
 
        .medal {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, .95);
            font-size: 22px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
            box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .35), 0 4px 10px rgba(0, 0, 0, .25);
        }
        .medal::after { content: "\2605"; }
        .medal.bronze   { background: radial-gradient(circle at 35% 30%, #f1b88a, #b9703a 70%); }
        .medal.silver   { background: radial-gradient(circle at 35% 30%, #f4f6fa, #98a3b5 70%); }
        .medal.gold     { background: radial-gradient(circle at 35% 30%, #fff0a8, #e0a21c 70%); }
        .medal.platinum { background: radial-gradient(circle at 35% 30%, #e9fbff, #5fc3d8 70%); }
 
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(calc(-50% + 14px)) scale(.97); }
            to   { opacity: 1; transform: translateY(-50%) scale(1); }
        }
 
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); }
        button:disabled { opacity: .55; cursor: not-allowed; }
 
        .under-game {
            display: flex;
            gap: 14px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .instructions { margin: 0; }
        body.flappy-page button.mini-btn:not(.theme-fab):not(.menu-toggle):not(.mobile-menu-close) {
            padding: 6px 12px;
            font-size: .72rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            background: transparent !important;
            color: var(--game-text) !important;
            border: 1px solid var(--game-border) !important;
        }
 
        .leaderboard {
            width: min(420px, 90vw);
            margin: 18px auto 0;
            border-radius: 12px;
            padding: 16px;
        }
        .leaderboard h3 { margin: 0 0 12px; text-transform: uppercase; letter-spacing: .08em; }
        .leaderboard ol { margin: 0; padding-left: 18px; text-align: left; }
        .leaderboard li { margin: 8px 0; font-weight: 600; }
 
        .player-status { min-height: 22px; margin: 8px 0 0; font-size: .9rem; }
 
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }
 
        @media (max-width: 450px) {
            .nickname-row { flex-direction: column; }
            input { width: 100%; }
        }
 
        @media (prefers-reduced-motion: reduce) {
            #message { animation: none; }
        }
    </style>

</head>

    <div class="page-shell">
        <div class="container">
            <h1>Flappy Bird</h1>
 
            <div class="player-panel">
                <label for="nickname">Enter a nickname</label>
                <div class="nickname-row">
                    <input id="nickname" type="text" maxlength="16" placeholder="Your nickname">
                    <button id="register-btn" type="button">REGISTER</button>
                </div>
                <div class="difficulty-control">
                    <label for="difficulty">Flight difficulty</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="normal">Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                <p id="player-status" class="player-status" aria-live="polite"></p>
            </div>
 
            <div id="game">
                <canvas id="stage" width="400" height="600" role="img" aria-label="Flappy Bird game"></canvas>
                <div id="message"></div>
            </div>
            <div class="sr-only" id="sr-status" aria-live="polite"></div>
 
            <div class="under-game">
                <p class="instructions">SPACE / CLICK / TAP = Flap &middot; Grab the bubble for a shield</p>
                <button class="mini-btn" id="sound-btn" type="button" aria-pressed="false">Sound: on</button>
            </div>
 
            <div class="leaderboard">
                <h3>Leaderboard</h3>

    <script>
(() => {
    'use strict';
 
    /* ------------------------------------------------------------------ */
    /*  DOM                                                                */
    /* ------------------------------------------------------------------ */
    const game = document.getElementById('game');
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const message = document.getElementById('message');
    const registerBtn = document.getElementById('register-btn');
    const nicknameInput = document.getElementById('nickname');
    const difficultySelect = document.getElementById('difficulty');
    const leaderboardList = document.getElementById('leaderboard-list');
    const statusEl = document.getElementById('player-status');
    const soundBtn = document.getElementById('sound-btn');
    const srStatus = document.getElementById('sr-status');
 
    /* ------------------------------------------------------------------ */
    /*  Tuning                                                             */
    /* ------------------------------------------------------------------ */
    const W = 400;                    // world width in CSS px (height follows the container)
    const GROUND_H = 76;
    const BIRD_X = 110;
    const BIRD_R = 12.5;              // collision radius (the sprite is a bit bigger, so near-misses feel fair)
    const PIPE_W = 66;
    const CAP_H = 26;
    const CAP_OVER = 6;
    const FRAME_MS = 1000 / 60;       // physics are tuned for 60 FPS and scaled by delta time
    const SHIELD_INVULN = 100;        // frames of safety after a shield pops (~1.7s)
    const PI2 = Math.PI * 2;
 
    // gravity = px/frame^2, jump = instant upward velocity, maxFall = terminal velocity
    const levels = {
        easy:   { gravity: 0.45, jump: -7.6, maxFall: 10, speed: 2.5, gap: 180, interval: 2000 },
        normal: { gravity: 0.50, jump: -8.0, maxFall: 11, speed: 3.0, gap: 160, interval: 1700 },
        hard:   { gravity: 0.55, jump: -8.3, maxFall: 12, speed: 3.8, gap: 140, interval: 1450 }
    };
 
    const leaderboardKey = 'flappyBirdLeaderboard';
    const difficultyKey = 'flappyBirdDifficulty';
    const muteKey = 'flappyBirdMuted';
    const bestKey = () => 'flappyBirdBest_' + difficultySelect.value;
 
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 
    /* ------------------------------------------------------------------ */
    /*  State                                                              */
    /* ------------------------------------------------------------------ */
    let H = 600, scale = 1, dpr = 1;
    let state = 'menu';               // menu | ready | playing | dying | over
    let playerName = '';
    let score = 0, best = 0, newBest = false;
    const bird = { y: 300, vy: 0, tilt: 0, rot: 0, vr: 0, flapT: 0, squash: 0 };
    let pipes = [], orb = null, particles = [], floaters = [];
    let shield = false, shieldT = 0, invuln = 0;
    let distSinceSpawn = 0, spacing = 300, pipeCount = 0, sinceShield = 0;
    let scroll = 0, time = 0, last = 0;
    let flash = 0, flashHold = 0, shake = 0, freeze = 0, scorePop = 0;
    let deadTime = 0, overTime = 0, overShown = false;
    let blend = 0, targetBlend = 0;   // 0 = day, 1 = night
    let visible = true;
 
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const rand = (a, b) => a + Math.random() * (b - a);
    const groundTop = () => H - GROUND_H;
    const level = () => levels[difficultySelect.value] || levels.normal;
 
    /* ------------------------------------------------------------------ */
    /*  Palettes (day <-> night, blended while the theme switch animates)  */
    /* ------------------------------------------------------------------ */
    const DAY = {
        skyTop: '#8fd6dc', skyMid: '#cdeee2', skyBot: '#f6eed2',
        hillFar: '#a9d6c6', hillMid: '#86c3a3', hillNear: '#63b089', bush: '#4f9c78',
        pipeA: '#2f7a5a', pipeB: '#8ad08b', pipeC: '#4c9f69', pipeD: '#235f48',
        cap: '#9bdc93', capShade: '#3f8c62', outline: '#1f4d3a',
        ground: '#e6d49a', groundTop: '#66b671', stripe: '#d8c485', groundLine: '#b7a266',
        cloud: '#ffffff'
    };
    const NIGHT = {
        skyTop: '#0b1034', skyMid: '#171d48', skyBot: '#2b2f6e',
        hillFar: '#262c66', hillMid: '#1e2557', hillNear: '#171c49', bush: '#12173d',
        pipeA: '#404a86', pipeB: '#aeb8ff', pipeC: '#7582ce', pipeD: '#323a70',
        cap: '#c4cbff', capShade: '#59639f', outline: '#1a1f48',
        ground: '#1b2150', groundTop: '#6e7bd0', stripe: '#171c46', groundLine: '#10143a',
        cloud: '#9aa4ff'
    };
    const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const DAY_RGB = {}, NIGHT_RGB = {};
    Object.keys(DAY).forEach(k => { DAY_RGB[k] = rgb(DAY[k]); NIGHT_RGB[k] = rgb(NIGHT[k]); });
    const P = {};
    let paletteBlend = -1;
    function palette() {
        if (blend !== paletteBlend) {
            Object.keys(DAY_RGB).forEach(k => {
                const a = DAY_RGB[k], b = NIGHT_RGB[k];
                P[k] = `rgb(${Math.round(lerp(a[0], b[0], blend))},${Math.round(lerp(a[1], b[1], blend))},${Math.round(lerp(a[2], b[2], blend))})`;
            });
            paletteBlend = blend;
        }
        return P;
    }
 
    /* ------------------------------------------------------------------ */
    /*  Sound                                                              */
    /* ------------------------------------------------------------------ */
    let audioContext;
    let muted = localStorage.getItem(muteKey) === '1';
 
    function audio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioContext = audioContext || new AC();
        if (audioContext.state === 'suspended') audioContext.resume();
        return audioContext;
    }
    function tone(f0, f1, dur, type, vol, delay) {
        const ac = audio();
        if (!ac) return;
        const t = ac.currentTime + (delay || 0);
        const osc = ac.createOscillator(), gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, t);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(t); osc.stop(t + dur);
    }
    function noise(dur, vol, delay) {
        const ac = audio();
        if (!ac) return;
        const t = ac.currentTime + (delay || 0);
        const len = Math.max(1, Math.floor(ac.sampleRate * dur));
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ac.createBufferSource(), gain = ac.createGain();
        src.buffer = buf;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        src.connect(gain); gain.connect(ac.destination);
        src.start(t);
    }
    function playSound(type) {
        if (muted) return;
        switch (type) {
            case 'flap':   tone(260, 520, 0.11, 'square', 0.07); break;
            case 'score':  tone(660, 990, 0.14, 'triangle', 0.12); break;
            case 'shield': tone(520, 780, 0.10, 'sine', 0.14); tone(780, 1170, 0.18, 'sine', 0.14, 0.09); break;
            case 'break':  noise(0.28, 0.18); tone(520, 120, 0.26, 'sawtooth', 0.09); break;
            case 'hit':    noise(0.18, 0.22); tone(190, 60, 0.22, 'square', 0.13); break;
            case 'fall':   tone(560, 90, 0.85, 'sine', 0.09, 0.2); break;
        }
    }
    function syncSoundButton() {
        soundBtn.textContent = muted ? 'Sound: off' : 'Sound: on';
        soundBtn.setAttribute('aria-pressed', String(muted));
    }
    soundBtn.addEventListener('click', () => {
        muted = !muted;
        localStorage.setItem(muteKey, muted ? '1' : '0');
        syncSoundButton();
        soundBtn.blur();
    });
 
    /* ------------------------------------------------------------------ */
    /*  Player, difficulty, leaderboard (same storage as before)           */
    /* ------------------------------------------------------------------ */
    const savedDifficulty = localStorage.getItem(difficultyKey);
    if (levels[savedDifficulty]) difficultySelect.value = savedDifficulty;
    difficultySelect.addEventListener('change', () => {
        localStorage.setItem(difficultyKey, difficultySelect.value);
        best = Number(localStorage.getItem(bestKey()) || 0);
    });
 
    function setStartButtonState() {
        const startBtn = document.getElementById('start-btn');
        if (!startBtn) return;
        const hasName = playerName.trim().length > 0;
        startBtn.disabled = !hasName;
        startBtn.textContent = hasName ? 'START GAME' : 'REGISTER TO PLAY';
    }
 
    function normalizeLeaderboard(entries) {
        const merged = new Map();
        (entries || []).forEach(entry => {
            const safeName = String(entry && entry.name || '').trim();
            const scoreValue = Number(entry && entry.score || 0);
            if (!safeName) return;
            const key = safeName.toLowerCase();
            if (!merged.has(key)) { merged.set(key, { name: safeName, score: scoreValue }); return; }
            const current = merged.get(key);
            current.score = Math.max(current.score, scoreValue);
        });
        return Array.from(merged.values()).sort((a, b) => b.score - a.score);
    }
 
    function renderLeaderboard() {
        const stored = normalizeLeaderboard(JSON.parse(localStorage.getItem(leaderboardKey) || '[]'));
        localStorage.setItem(leaderboardKey, JSON.stringify(stored));
        leaderboardList.innerHTML = '';
        if (!stored.length) {
            const empty = document.createElement('li');
            empty.textContent = 'No scores yet. Be the first!';
            leaderboardList.appendChild(empty);
            return;
        }
        stored.slice(0, 5).forEach((entry, index) => {
            const item = document.createElement('li');
            item.textContent = `#${index + 1} ${entry.name} \u2014 ${entry.score}`;
            leaderboardList.appendChild(item);
        });
    }
 
    function saveLeaderboard() {
        const stored = normalizeLeaderboard(JSON.parse(localStorage.getItem(leaderboardKey) || '[]'));
        const existing = stored.find(entry => entry.name.toLowerCase() === playerName.toLowerCase());
        if (existing) existing.score = Math.max(existing.score, score);
        else stored.push({ name: playerName, score });
        stored.sort((a, b) => b.score - a.score);
        localStorage.setItem(leaderboardKey, JSON.stringify(stored.slice(0, 5)));
        renderLeaderboard();
    }
 
    function registerPlayer() {
        playerName = nicknameInput.value.trim();
        if (!playerName) {
            statusEl.textContent = 'Please enter a nickname first.';
            statusEl.style.color = '#cc4040';
            setStartButtonState();
            return;
        }
        statusEl.textContent = `Nickname ready: ${playerName}`;
        statusEl.style.color = '#1e7a3d';
        setStartButtonState();
    }
    registerBtn.addEventListener('click', registerPlayer);
    nicknameInput.addEventListener('keydown', e => { if (e.key === 'Enter') registerPlayer(); });
 
    /* ------------------------------------------------------------------ */
    /*  Overlay cards                                                      */
    /* ------------------------------------------------------------------ */
    function renderMenu() {
        message.innerHTML = `
            <h2>Flappy Bird</h2>
            <p>Press <b>SPACE</b>, click or tap to flap.<br>Grab the glowing bubble to survive one hit.</p>
            <button id="start-btn" type="button">START GAME</button>`;
        message.style.display = 'block';
        setStartButtonState();
    }
 
    function showOver() {
        if (overShown) return;
        overShown = true;
        state = 'over';
        overTime = time;
        const medal = score >= 40 ? 'platinum' : score >= 30 ? 'gold' : score >= 20 ? 'silver' : score >= 10 ? 'bronze' : '';
        message.innerHTML = `
            <h2>Game over</h2>
            ${newBest && score > 0 ? '<p class="newbest">New best!</p>' : ''}
            <div class="result-row">
                <div class="result"><span>Score</span><b>${score}</b></div>
                <div class="result"><span>Best</span><b>${best}</b></div>
                ${medal ? `<div class="medal ${medal}" title="${medal} medal"></div>` : ''}
            </div>
            <button id="again-btn" type="button">PLAY AGAIN</button>
            <p class="hint">or press Space</p>`;
        message.style.display = 'block';
        difficultySelect.disabled = false;
        srStatus.textContent = `Game over. Score ${score}. Best ${best}.`;
        const again = document.getElementById('again-btn');
        if (again) again.focus({ preventScroll: true });
    }
 
    message.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.id === 'start-btn') beginRun();
        if (btn.id === 'again-btn') restart();
    });
 
    /* ------------------------------------------------------------------ */
    /*  Sizing                                                             */
    /* ------------------------------------------------------------------ */
    function resize() {
        const cw = game.clientWidth, ch = game.clientHeight;
        if (!cw || !ch) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        scale = cw / W;
        if (state !== 'playing' && state !== 'dying') H = ch / scale;
        canvas.width = Math.round(cw * dpr);
        canvas.height = Math.round(ch * dpr);
        if (state === 'menu' || state === 'ready' || state === 'over') bird.y = (groundTop()) / 2;
    }
 
    /* ------------------------------------------------------------------ */
    /*  Run control                                                        */
    /* ------------------------------------------------------------------ */
    function resetWorld() {
        pipes = []; orb = null; particles = []; floaters = [];
        score = 0; newBest = false; shield = false; shieldT = 0; invuln = 0;
        pipeCount = 0; sinceShield = 0; distSinceSpawn = 0;
        flash = 0; shake = 0; freeze = 0; scorePop = 0;
        overShown = false;
        bird.y = groundTop() / 2; bird.vy = 0; bird.tilt = 0; bird.rot = 0; bird.vr = 0; bird.flapT = 0; bird.squash = 0;
    }
 
    function beginRun() {
        if (!playerName.trim()) {
            statusEl.textContent = 'Please register a nickname first.';
            statusEl.style.color = '#cc4040';
            return;
        }
        if (state !== 'menu') return;
        audio();
        best = Number(localStorage.getItem(bestKey()) || 0);
        resetWorld();
        state = 'ready';
        difficultySelect.disabled = true;
        message.style.display = 'none';
        srStatus.textContent = 'Get ready. Press space to flap.';
    }
 
    function restart() {
        if (state !== 'over') return;
        resetWorld();
        state = 'ready';
        difficultySelect.disabled = true;
        message.style.display = 'none';
        srStatus.textContent = 'Get ready. Press space to flap.';
    }
 
    function pressed() {
        if (state === 'ready') {
            state = 'playing';
            spawnPipe(true);
            flap();
        } else if (state === 'playing') {
            flap();
        } else if (state === 'over' && time - overTime > 0.35) {
            restart();
        }
    }
 
    function flap() {
        const L = level();
        bird.vy = L.jump;
        bird.flapT = 0.3;
        bird.squash = 1;
        playSound('flap');
        for (let i = 0; i < 3; i++) {
            particles.push({ type: 'dot', x: BIRD_X - 14, y: bird.y + rand(-4, 8), vx: rand(-2.2, -0.8), vy: rand(-0.4, 0.8), g: 0.02,
                life: 0.4, max: 0.4, size: rand(2.5, 4.5), color: '#ffffff' });
        }
    }
 
    /* ------------------------------------------------------------------ */
    /*  World generation                                                   */
    /* ------------------------------------------------------------------ */
    function spawnPipe(first) {
        const L = level();
        const gap = L.gap;
        const margin = 60;
        const minTop = margin;
        const maxTop = Math.max(minTop + 1, groundTop() - gap - margin);
        let gapTop;
        if (first || !pipes.length) {
            gapTop = (groundTop() - gap) / 2;
        } else {
            const prev = pipes[pipes.length - 1].gapTop;
            gapTop = clamp(prev + rand(-190, 190), minTop, maxTop);   // keeps every gap reachable
        }
        const x = W + (first ? 60 : 20);
        pipes.push({ x, gapTop, gap, passed: false });
        pipeCount++;
 
        // sometimes a shield bubble floats in the gap
        if (!shield && !orb && pipeCount >= 3) {
            sinceShield++;
            if ((sinceShield >= 5 && Math.random() < 0.55) || sinceShield >= 9) {
                orb = { x: x + PIPE_W / 2, y: gapTop + gap / 2 + rand(-gap * 0.16, gap * 0.16), phase: rand(0, 6) };
                sinceShield = 0;
            }
        }
 
        const accel = Math.floor(score / 15) * 150;
        spacing = Math.max(180, L.speed * Math.max(L.interval - accel, 900) / FRAME_MS);
        distSinceSpawn = 0;
    }
 
    /* ------------------------------------------------------------------ */
    /*  Collisions                                                         */
    /* ------------------------------------------------------------------ */
    function circleRect(cx, cy, r, rx, ry, rw, rh) {
        const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
        const dx = cx - nx, dy = cy - ny;
        return dx * dx + dy * dy < r * r;
    }
 
    function hitsPipe(p) {
        const x = p.x, bx = BIRD_X, by = bird.y, r = BIRD_R;
        const botY = p.gapTop + p.gap;
        return (
            circleRect(bx, by, r, x + 4, -200, PIPE_W - 8, p.gapTop + 200 - CAP_H) ||                       // top body
            circleRect(bx, by, r, x - CAP_OVER + 2, p.gapTop - CAP_H, PIPE_W + CAP_OVER * 2 - 4, CAP_H) ||   // top cap
            circleRect(bx, by, r, x - CAP_OVER + 2, botY, PIPE_W + CAP_OVER * 2 - 4, CAP_H) ||               // bottom cap
            circleRect(bx, by, r, x + 4, botY + CAP_H, PIPE_W - 8, H)                                        // bottom body
        );
    }
 
    // returns true when the run ended
    function onHit(kind) {
        const L = level();
        if (invuln > 0) {
            if (kind === 'ground') { bird.y = groundTop() - BIRD_R - 2; bird.vy = L.jump * 0.9; }
            return false;
        }
        if (shield) {
            popShield();
            invuln = SHIELD_INVULN;
            if (kind === 'ground') { bird.y = groundTop() - BIRD_R - 2; bird.vy = L.jump * 1.1; }
            else bird.vy = Math.min(bird.vy, L.jump * 0.6);
            return false;
        }
        die();
        return true;
    }
 
    function popShield() {
        shield = false;
        playSound('break');
        shake = reduceMotion ? 0 : 5;
        particles.push({ type: 'ring', x: BIRD_X, y: bird.y, vx: 0, vy: 0, g: 0, life: 0.45, max: 0.45, size: 30, grow: 70, color: '#bff4ff', front: true });
        for (let i = 0; i < 16; i++) {
            const a = (i / 16) * PI2 + rand(-0.2, 0.2), s = rand(2.5, 5.5);
            particles.push({ type: 'shard', x: BIRD_X + Math.cos(a) * 26, y: bird.y + Math.sin(a) * 26, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                g: 0.12, life: rand(0.5, 0.8), max: 0.8, size: rand(3, 6), rot: rand(0, PI2), vr: rand(-0.3, 0.3), color: '#9fe8ff', front: true });
        }
        floaters.push({ text: 'SHIELD BROKE', x: BIRD_X, y: bird.y - 44, life: 1, max: 1, color: '#d8f7ff' });
    }
 
    function collectShield() {
        orb = null;
        shield = true;
        shieldT = 0;
        playSound('shield');
        particles.push({ type: 'ring', x: BIRD_X, y: bird.y, vx: 0, vy: 0, g: 0, life: 0.5, max: 0.5, size: 12, grow: 60, color: '#9fe8ff', front: true });
        for (let i = 0; i < 12; i++) {
            const a = rand(0, PI2), s = rand(1.5, 4);
            particles.push({ type: 'spark', x: BIRD_X, y: bird.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 0, life: rand(0.4, 0.7), max: 0.7,
                size: rand(3, 6), rot: 0, vr: 0.1, color: '#e6fbff', front: true });
        }
        floaters.push({ text: 'SHIELD!', x: BIRD_X, y: bird.y - 44, life: 1, max: 1, color: '#d8f7ff' });
    }
 
    function die() {
        state = 'dying';
        deadTime = time;
        freeze = 0.075;                                  // brief hit-stop
        flash = reduceMotion ? 0.5 : 1;                  // white flash
        flashHold = 0.05;
        shake = reduceMotion ? 0 : 9;
        bird.vy = -7.5;                                  // little pop, then it tumbles off the screen
        bird.vr = (Math.random() < 0.5 ? -1 : 1) * rand(0.14, 0.24);
        bird.rot = bird.tilt;
        playSound('hit');
        playSound('fall');
        for (let i = 0; i < 12; i++) {
            const a = rand(0, PI2), s = rand(2, 6);
            particles.push({ type: 'feather', x: BIRD_X, y: bird.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, g: 0.16, life: rand(0.9, 1.5), max: 1.5,
                size: rand(4, 7), rot: rand(0, PI2), vr: rand(-0.3, 0.3), color: i % 3 === 0 ? '#e4872a' : '#ffd24f', front: true });
        }
 
        if (score > best) {
            best = score;
            newBest = true;
            localStorage.setItem(bestKey(), String(best));
        }
        if (playerName.trim()) saveLeaderboard();
    }
 
    /* ------------------------------------------------------------------ */
    /*  Update                                                             */
    /* ------------------------------------------------------------------ */
    const clouds = [];
    for (let i = 0; i < 6; i++) clouds.push({ x: rand(0, W + 120), y: rand(0.08, 0.42), s: rand(0.5, 0.95), v: rand(6, 16) });
    const stars = [];
    for (let i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random() * 0.6, r: rand(0.6, 1.7), p: rand(0, 6) });
    const shooter = { t: rand(4, 8), x: 0, y: 0, life: 0 };
 
    function update(dt, sec) {
        time += sec;
        blend += clamp(targetBlend - blend, -sec * 3, sec * 3);
 
        if (flash > 0) {
            if (flashHold > 0) flashHold -= sec;
            else flash = Math.max(0, flash - sec / 0.55);
        }
        if (shake > 0) shake = Math.max(0, shake - sec * 40);
        scorePop = Math.max(0, scorePop - sec * 4);
        if (shield) shieldT = Math.min(1, shieldT + sec * 4);
 
        clouds.forEach(c => { c.x -= c.v * sec; if (c.x < -140) { c.x = W + 140; c.y = rand(0.08, 0.42); } });
        shooter.t -= sec;
        if (shooter.t <= 0 && blend > 0.8) { shooter.t = rand(5, 10); shooter.life = 0.7; shooter.x = rand(60, W - 40); shooter.y = rand(20, 140); }
        if (shooter.life > 0) shooter.life -= sec;
 
        updateParticles(dt, sec);
        if (freeze > 0) { freeze -= sec; return; }
 
        if (state === 'menu' || state === 'ready') idle(dt, sec);
        else if (state === 'playing') play(dt, sec);
        else if (state === 'dying') dying(dt, sec);
    }
 
    function updateParticles(dt, sec) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
            if (p.vr) p.rot += p.vr * dt;
            if (p.grow) p.size += p.grow * sec;
            p.life -= sec;
            if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = floaters.length - 1; i >= 0; i--) {
            const f = floaters[i];
            f.y -= 22 * sec; f.life -= sec;
            if (f.life <= 0) floaters.splice(i, 1);
        }
    }
 
    function idle(dt, sec) {
        scroll += 0.9 * dt;
        bird.y = groundTop() / 2 + Math.sin(time * 4) * 7;
        bird.tilt = Math.sin(time * 4) * 0.08;
        bird.flapT = Math.max(0, bird.flapT - sec);
    }
 
    function play(dt, sec) {
        const L = level();
        scroll += L.speed * dt;
 
        bird.vy = Math.min(bird.vy + L.gravity * dt, L.maxFall);
        bird.y += bird.vy * dt;
        if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.vy = 0; }       // bumps the ceiling like the original
 
        const targetTilt = clamp(bird.vy * 6, -25, 80) * Math.PI / 180;
        bird.tilt += (targetTilt - bird.tilt) * Math.min(1, 0.3 * dt);
        bird.flapT = Math.max(0, bird.flapT - sec);
        bird.squash = Math.max(0, bird.squash - sec * 7);
        if (invuln > 0) invuln -= dt;
 
        distSinceSpawn += L.speed * dt;
        if (distSinceSpawn >= spacing) spawnPipe(false);
 
        for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            p.x -= L.speed * dt;
 
            if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) {
                p.passed = true;
                score++;
                scorePop = 1;
                playSound('score');
                for (let k = 0; k < 5; k++) {
                    particles.push({ type: 'spark', x: BIRD_X + 10, y: bird.y, vx: rand(-1, 2), vy: rand(-2, 1), g: 0.05, life: 0.45, max: 0.45,
                        size: rand(2.5, 4.5), rot: 0, vr: 0.12, color: '#fff6b0', front: true });
                }
            }
 
            if (hitsPipe(p) && onHit('pipe')) return;
 
            if (p.x < -PIPE_W - CAP_OVER - 10) pipes.splice(i, 1);
        }
 
        if (orb) {
            orb.x -= L.speed * dt;
            const dx = orb.x - BIRD_X, dy = orb.y - bird.y;
            if (dx * dx + dy * dy < (BIRD_R + 18) * (BIRD_R + 18)) collectShield();
            else if (orb.x < -40) orb = null;
        }
 
        if (bird.y + BIRD_R >= groundTop() && onHit('ground')) return;
    }
 
    function dying(dt) {
        // the world holds still while the bird loses control and falls off the screen
        bird.vy += 0.62 * dt;
        bird.y += bird.vy * dt;
        bird.rot += bird.vr * dt;
        const since = time - deadTime;
        if ((bird.y > H + 90 && since > 0.9) || since > 3.2) showOver();
    }
 
    /* ------------------------------------------------------------------ */
    /*  Drawing helpers                                                    */
    /* ------------------------------------------------------------------ */
    function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }
 
    function circle(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, PI2); }
 
    function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
 
    function drawSky(c) {
        const g = ctx.createLinearGradient(0, 0, 0, groundTop());
        g.addColorStop(0, c.skyTop);
        g.addColorStop(0.62, c.skyMid);
        g.addColorStop(1, c.skyBot);
        ctx.fillStyle = g;
        ctx.fillRect(-10, -10, W + 20, H + 20);
    }
 
    function drawCelestial() {
        const x = W * 0.76, y = 98;
        const day = 1 - blend;
        if (day > 0.01) {
            ctx.save();
            ctx.globalAlpha = day;
            const g = ctx.createRadialGradient(x, y, 6, x, y, 80);
            g.addColorStop(0, 'rgba(255,244,176,.75)');
            g.addColorStop(1, 'rgba(255,244,176,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, 80, 0, PI2); ctx.fill();
            ctx.fillStyle = '#fff6c2';
            ctx.beginPath(); ctx.arc(x, y, 26, 0, PI2); ctx.fill();
            ctx.restore();
        }
        if (blend > 0.01) {
            ctx.save();
            ctx.globalAlpha = blend;
            const g = ctx.createRadialGradient(x, y, 8, x, y, 90);
            g.addColorStop(0, 'rgba(196,203,255,.4)');
            g.addColorStop(1, 'rgba(196,203,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(x, y, 90, 0, PI2); ctx.fill();
            ctx.fillStyle = '#f4efd8';
            ctx.beginPath(); ctx.arc(x, y, 25, 0, PI2); ctx.fill();
            ctx.fillStyle = 'rgba(190,180,150,.35)';
            ctx.beginPath(); ctx.arc(x - 8, y - 6, 5, 0, PI2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 9, y + 5, 7, 0, PI2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 2, y - 12, 3.2, 0, PI2); ctx.fill();
            ctx.restore();
        }
    }
 
    function drawStars() {
        if (blend < 0.02) return;
        ctx.save();
        for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            const a = blend * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * 2 + s.p)));
            ctx.globalAlpha = a;
            ctx.fillStyle = i % 4 === 0 ? '#c4cbff' : '#ffffff';
            ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, PI2); ctx.fill();
        }
        if (shooter.life > 0) {
            const k = 1 - shooter.life / 0.7;
            const sx = shooter.x - k * 120, sy = shooter.y + k * 60;
            const g = ctx.createLinearGradient(sx, sy, sx + 50, sy - 25);
            g.addColorStop(0, 'rgba(255,255,255,.9)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.globalAlpha = blend * (1 - k);
            ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 50, sy - 25); ctx.stroke();
        }
        ctx.restore();
    }
 
    function drawClouds(c) {
        ctx.save();
        ctx.fillStyle = c.cloud;
        ctx.globalAlpha = lerp(0.85, 0.1, blend);
        const base = groundTop();
        clouds.forEach(cl => {
            const x = cl.x, y = cl.y * base, s = cl.s;
            ctx.beginPath();
            circle(x, y, 20 * s);
            circle(x + 24 * s, y - 9 * s, 26 * s);
            circle(x + 54 * s, y - 2 * s, 21 * s);
            circle(x + 28 * s, y + 7 * s, 24 * s);
            ctx.fill();
        });
        ctx.restore();
    }
 
    function hillLayer(color, baseY, a1, f1, a2, f2, off) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-10, H + 10);
        for (let x = -10; x <= W + 10; x += 8) {
            const y = baseY - a1 * Math.sin((x + off) * f1) - a2 * Math.sin((x + off) * f2 + 1.7);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(W + 10, H + 10);
        ctx.closePath();
        ctx.fill();
    }
 
    function drawHills(c) {
        const gt = groundTop();
        hillLayer(c.hillFar, gt - 78, 26, 0.012, 12, 0.031, scroll * 0.10);
        hillLayer(c.hillMid, gt - 42, 20, 0.017, 9, 0.043, scroll * 0.26 + 140);
        // bushes along the near hill
        const period = 150, off = scroll * 0.55;
        ctx.fillStyle = c.bush;
        const first = Math.floor(off / period) - 1;
        for (let i = first; i < first + Math.ceil(W / period) + 3; i++) {
            const x = i * period - off + hash(i) * 60;
            const s = 0.8 + hash(i + 9) * 0.7;
            ctx.beginPath();
            ctx.arc(x, gt - 4, 17 * s, Math.PI, 0);
            ctx.arc(x + 20 * s, gt - 4, 22 * s, Math.PI, 0);
            ctx.arc(x + 42 * s, gt - 4, 15 * s, Math.PI, 0);
            ctx.closePath();
            ctx.fill();
        }
        hillLayer(c.hillNear, gt + 4, 9, 0.022, 5, 0.057, scroll * 0.55 + 300);
    }
 
    function drawPipes(c) {
        if (!pipes.length) return;
        const body = ctx.createLinearGradient(0, 0, PIPE_W, 0);
        body.addColorStop(0, c.pipeA);
        body.addColorStop(0.28, c.pipeB);
        body.addColorStop(0.66, c.pipeC);
        body.addColorStop(1, c.pipeD);
        const capG = ctx.createLinearGradient(-CAP_OVER, 0, PIPE_W + CAP_OVER, 0);
        capG.addColorStop(0, c.pipeC);
        capG.addColorStop(0.3, c.cap);
        capG.addColorStop(0.7, c.pipeC);
        capG.addColorStop(1, c.capShade);
 
        pipes.forEach(p => {
            if (p.x > W + 20 || p.x < -PIPE_W - 20) return;
            ctx.save();
            ctx.translate(p.x, 0);
            const botY = p.gapTop + p.gap;
            const segs = [
                { y: -6, h: p.gapTop - CAP_H + 6, capY: p.gapTop - CAP_H },
                { y: botY + CAP_H - 2, h: H - (botY + CAP_H - 2) + 6, capY: botY }
            ];
            segs.forEach(s => {
                ctx.fillStyle = body;
                ctx.fillRect(0, s.y, PIPE_W, s.h);
                ctx.fillStyle = 'rgba(255,255,255,.2)';
                ctx.fillRect(9, s.y, 7, s.h);
                ctx.fillStyle = 'rgba(0,0,0,.14)';
                ctx.fillRect(PIPE_W - 14, s.y, 14, s.h);
                ctx.lineWidth = 2;
                ctx.strokeStyle = c.outline;
                ctx.beginPath();
                ctx.moveTo(1, s.y); ctx.lineTo(1, s.y + s.h);
                ctx.moveTo(PIPE_W - 1, s.y); ctx.lineTo(PIPE_W - 1, s.y + s.h);
                ctx.stroke();
 
                rr(-CAP_OVER, s.capY, PIPE_W + CAP_OVER * 2, CAP_H, 6);
                ctx.fillStyle = capG;
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,.3)';
                ctx.fillRect(-CAP_OVER + 7, s.capY + 5, 6, CAP_H - 10);
                ctx.fillStyle = 'rgba(0,0,0,.12)';
                ctx.fillRect(PIPE_W + CAP_OVER - 12, s.capY + 3, 10, CAP_H - 6);
            });
            ctx.restore();
        });
    }
 
    function drawGround(c) {
        const gt = groundTop();
        ctx.fillStyle = c.ground;
        ctx.fillRect(-10, gt, W + 20, GROUND_H + 10);
        // scrolling diagonal stripes
        ctx.fillStyle = c.stripe;
        const sw = 26, off = scroll % (sw * 2);
        for (let x = -sw * 2 - off; x < W + sw * 2; x += sw * 2) {
            ctx.beginPath();
            ctx.moveTo(x + 12, gt + 14);
            ctx.lineTo(x + 12 + sw, gt + 14);
            ctx.lineTo(x + sw, gt + GROUND_H + 10);
            ctx.lineTo(x, gt + GROUND_H + 10);
            ctx.closePath();
            ctx.fill();
        }
        // grass lip
        ctx.fillStyle = c.groundTop;
        ctx.fillRect(-10, gt, W + 20, 14);
        const tuft = 16, toff = scroll % tuft;
        ctx.beginPath();
        for (let x = -tuft - toff; x < W + tuft; x += tuft) {
            ctx.moveTo(x, gt + 14);
            ctx.lineTo(x + tuft / 2, gt + 22);
            ctx.lineTo(x + tuft, gt + 14);
        }
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.22)';
        ctx.fillRect(-10, gt, W + 20, 3);
        ctx.fillStyle = c.groundLine;
        ctx.fillRect(-10, gt + 14, W + 20, 2);
    }
 
    function drawOrb() {
        const o = orb;
        const x = o.x, y = o.y + Math.sin(time * 3 + o.phase) * 4, r = 16;
        const glow = ctx.createRadialGradient(x, y, 2, x, y, r * 2.4);
        glow.addColorStop(0, 'rgba(120,225,255,.6)');
        glow.addColorStop(1, 'rgba(120,225,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, PI2); ctx.fill();
 
        const b = ctx.createRadialGradient(x - 5, y - 6, 2, x, y, r);
        b.addColorStop(0, 'rgba(255,255,255,.95)');
        b.addColorStop(0.45, 'rgba(150,235,255,.8)');
        b.addColorStop(1, 'rgba(40,150,230,.95)');
        ctx.fillStyle = b;
        ctx.beginPath(); ctx.arc(x, y, r, 0, PI2); ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.stroke();
 
        // shield emblem
        ctx.beginPath();
        ctx.moveTo(x, y - 8);
        ctx.lineTo(x + 7, y - 5);
        ctx.quadraticCurveTo(x + 7, y + 4, x, y + 9);
        ctx.quadraticCurveTo(x - 7, y + 4, x - 7, y - 5);
        ctx.closePath();
        ctx.fillStyle = 'rgba(18,100,190,.9)';
        ctx.fill();
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
 
        // pulse ring
        const k = (time * 0.9 + o.phase) % 1;
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = 'rgba(190,245,255,.9)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, r + k * 14, 0, PI2); ctx.stroke();
        ctx.globalAlpha = 1;
    }
 
    function drawBirdSprite(wing, blinkOpen, look) {
        // tail
        ctx.fillStyle = '#e4872a';
        ctx.beginPath();
        ctx.moveTo(-14, -2); ctx.lineTo(-27, -9); ctx.lineTo(-24, -2); ctx.lineTo(-29, 4); ctx.lineTo(-14, 6);
        ctx.closePath(); ctx.fill();
        // body
        const bg = ctx.createLinearGradient(0, -16, 0, 16);
        bg.addColorStop(0, '#ffe66e'); bg.addColorStop(0.55, '#ffc93c'); bg.addColorStop(1, '#f0a22a');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.ellipse(0, 0, 19, 15.5, 0, 0, PI2); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(120,64,10,.55)'; ctx.stroke();
        // belly + cheek
        ctx.fillStyle = 'rgba(255,247,208,.95)';
        ctx.beginPath(); ctx.ellipse(3, 6.5, 12, 7.5, 0.15, 0, PI2); ctx.fill();
        ctx.fillStyle = 'rgba(255,120,90,.5)';
        ctx.beginPath(); ctx.arc(9, 3.5, 3.6, 0, PI2); ctx.fill();
        // crest
        ctx.fillStyle = '#f0a22a';
        ctx.beginPath();
        ctx.moveTo(-3, -14); ctx.quadraticCurveTo(-4, -23, -10, -21); ctx.quadraticCurveTo(-7, -18, -7, -13); ctx.closePath();
        ctx.moveTo(1, -15); ctx.quadraticCurveTo(2, -24, 8, -22); ctx.quadraticCurveTo(5, -18, 5, -14); ctx.closePath();
        ctx.fill();
        // wing
        ctx.save();
        ctx.translate(-5, 2);
        ctx.rotate(wing);
        const wg = ctx.createLinearGradient(0, -8, 0, 12);
        wg.addColorStop(0, '#ffd24f'); wg.addColorStop(1, '#e8902a');
        ctx.fillStyle = wg;
        ctx.beginPath(); ctx.ellipse(-6, 4, 13, 7.5, -0.25, 0, PI2); ctx.fill();
        ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(120,64,10,.5)'; ctx.stroke();
        ctx.restore();
        // eye
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(9, -6, 6.2, Math.max(0.6, 6.6 * blinkOpen), 0, 0, PI2); ctx.fill();
        ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(60,30,5,.6)'; ctx.stroke();
        if (blinkOpen > 0.4) {
            ctx.fillStyle = '#2a1a10';
            ctx.beginPath(); ctx.arc(10.8, -5.6 + look, 2.9, 0, PI2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(11.8, -6.6 + look, 1, 0, PI2); ctx.fill();
        }
        // beak
        ctx.fillStyle = '#ff8a2b';
        ctx.beginPath(); ctx.moveTo(15, -2.5); ctx.quadraticCurveTo(27, -3.5, 27, 1.5); ctx.lineTo(15, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e86a1d';
        ctx.beginPath(); ctx.moveTo(15, 2); ctx.lineTo(25.5, 2.5); ctx.quadraticCurveTo(22, 8.5, 14, 7); ctx.closePath(); ctx.fill();
    }
 
    function drawBird() {
        if (state === 'over') return;
        const dead = state === 'dying';
        const flapping = bird.flapT > 0;
        let wing;
        if (dead) wing = -0.9 + Math.sin(time * 30) * 0.5;                       // flailing
        else if (state === 'playing' || flapping) wing = flapping ? Math.sin((1 - bird.flapT / 0.3) * PI2 * 1.2 + 0.6) * 0.9 : 0.35;
        else wing = Math.sin(time * 11) * 0.55;                                  // idle flutter
        const blink = (Math.floor(time * 10) % 37 === 0) ? 0.1 : 1;
        const look = dead ? -1.5 : clamp(bird.vy * 0.12, -1.2, 1.4);
        const sx = 1 - bird.squash * 0.1, sy = 1 + bird.squash * 0.14;
        const rot = dead ? bird.rot : bird.tilt;
        let alpha = 1;
        if (invuln > 0 && !dead) alpha = Math.floor(time * 14) % 2 ? 0.45 : 1;
 
        ctx.save();
        ctx.translate(BIRD_X, bird.y);
        // soft halo at night so the bird never gets lost
        if (blend > 0.05 && !dead) {
            const h = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
            h.addColorStop(0, `rgba(255,222,120,${0.28 * blend})`);
            h.addColorStop(1, 'rgba(255,222,120,0)');
            ctx.fillStyle = h;
            ctx.beginPath(); ctx.arc(0, 0, 44, 0, PI2); ctx.fill();
        }
        ctx.globalAlpha = alpha;
        ctx.rotate(rot);
        ctx.scale(sx, sy);
        drawBirdSprite(wing, blink, look);
        ctx.restore();
 
        if (shield && !dead) drawShieldBubble();
    }
 
    function drawShieldBubble() {
        const x = BIRD_X, y = bird.y;
        const t = shieldT, pop = t < 1 ? 1 + Math.sin(t * Math.PI) * 0.25 : 1;       // grows in with a little overshoot
        const R = 31 * pop * (1 + Math.sin(time * 6) * 0.025) * Math.min(1, t * 1.4 + 0.15);
        const g = ctx.createRadialGradient(x, y, R * 0.45, x, y, R);
        g.addColorStop(0, 'rgba(130,230,255,0)');
        g.addColorStop(0.75, 'rgba(130,230,255,.14)');
        g.addColorStop(1, 'rgba(170,243,255,.5)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, R, 0, PI2); ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(215,250,255,.95)';
        ctx.stroke();
        ctx.lineCap = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(x, y, R - 5, -2.55, -1.65); ctx.stroke();
        const a = time * 2.2;
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * (R - 2), y + Math.sin(a) * (R - 2), 2.2, 0, PI2); ctx.fill();
    }
 
    function drawParticles(front) {
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (!!p.front !== front) continue;
            const k = clamp(p.life / p.max, 0, 1);
            ctx.save();
            ctx.globalAlpha = k;
            ctx.translate(p.x, p.y);
            if (p.type === 'dot') {
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(0, 0, p.size * (0.5 + k * 0.5), 0, PI2); ctx.fill();
            } else if (p.type === 'ring') {
                ctx.strokeStyle = p.color; ctx.lineWidth = 2.5 * k + 0.5;
                ctx.beginPath(); ctx.arc(0, 0, p.size, 0, PI2); ctx.stroke();
            } else if (p.type === 'shard') {
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.moveTo(-p.size, p.size * 0.6); ctx.lineTo(0, -p.size); ctx.lineTo(p.size, p.size * 0.6); ctx.closePath(); ctx.fill();
            } else if (p.type === 'feather') {
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.6, 0, 0, PI2); ctx.fill();
            } else if (p.type === 'spark') {
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                const s = p.size * (0.6 + k * 0.4);
                ctx.beginPath();
                ctx.moveTo(0, -s); ctx.lineTo(s * 0.3, -s * 0.3); ctx.lineTo(s, 0); ctx.lineTo(s * 0.3, s * 0.3);
                ctx.lineTo(0, s); ctx.lineTo(-s * 0.3, s * 0.3); ctx.lineTo(-s, 0); ctx.lineTo(-s * 0.3, -s * 0.3);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        }
    }
 
    function outlinedText(text, x, y, size, weight, fill) {
        ctx.font = `${weight} ${size}px Inter, system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = Math.max(3, size * 0.14);
        ctx.strokeStyle = 'rgba(10,25,45,.6)';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = fill;
        ctx.fillText(text, x, y);
    }
 
    function drawHUD() {
        if (state === 'playing' || state === 'dying') {
            const size = 58 * (1 + 0.22 * Math.sin(scorePop * Math.PI * 0.5 + 0) * scorePop);
            outlinedText(String(score), W / 2, 74, size, 800, '#ffffff');
            if (best > 0) outlinedText('BEST ' + best, W / 2, 114, 13, 700, 'rgba(255,255,255,.85)');
        }
        if (state === 'ready') {
            outlinedText('Get ready', W / 2, groundTop() / 2 - 92, 34, 800, '#ffffff');
            const pulse = 0.65 + 0.35 * Math.sin(time * 4);
            ctx.save();
            ctx.globalAlpha = pulse;
            outlinedText('Tap, click or press Space', W / 2, groundTop() / 2 + 78, 15, 700, '#ffffff');
            ctx.restore();
        }
        if (shield && state === 'playing') {
            ctx.save();
            ctx.translate(30, 36);
            const s = 1 + Math.sin(time * 5) * 0.05;
            ctx.scale(s, s);
            ctx.beginPath();
            ctx.moveTo(0, -13); ctx.lineTo(11, -8); ctx.quadraticCurveTo(11, 7, 0, 14); ctx.quadraticCurveTo(-11, 7, -11, -8);
            ctx.closePath();
            ctx.fillStyle = 'rgba(70,190,245,.92)';
            ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
            ctx.restore();
        }
        for (let i = 0; i < floaters.length; i++) {
            const f = floaters[i];
            ctx.save();
            ctx.globalAlpha = clamp(f.life / f.max * 1.4, 0, 1);
            outlinedText(f.text, clamp(f.x, 60, W - 60), f.y, 14, 800, f.color);
            ctx.restore();
        }
    }
 
    /* ------------------------------------------------------------------ */
    /*  Render                                                             */
    /* ------------------------------------------------------------------ */
    function render() {
        ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
        const c = palette();
        ctx.save();
        if (shake > 0) ctx.translate(rand(-1, 1) * shake, rand(-1, 1) * shake);
 
        drawSky(c);
        drawCelestial();
        drawStars();
        drawClouds(c);
        drawHills(c);
        drawPipes(c);
        if (orb) drawOrb();
        drawGround(c);
        drawParticles(false);
        drawBird();
        drawParticles(true);
        drawHUD();
        ctx.restore();
 
        if (flash > 0) {
            ctx.fillStyle = `rgba(255,255,255,${flash})`;
            ctx.fillRect(0, 0, W, H);
        }
    }
 
    /* ------------------------------------------------------------------ */
    /*  Loop + input                                                       */
    /* ------------------------------------------------------------------ */
    function frame(ts) {
        requestAnimationFrame(frame);
        if (!visible || document.hidden) { last = 0; return; }
        if (!last) last = ts;
        const raw = Math.min(ts - last, 50);
        last = ts;
        update(raw / FRAME_MS, raw / 1000);
        render();
    }
 
    function typing(target) {
        return target && /^(INPUT|SELECT|TEXTAREA)$/.test(target.tagName);
    }
 
    document.addEventListener('keydown', e => {
        if (typing(e.target)) return;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            if (state === 'menu') return;
            e.preventDefault();
            if (!e.repeat) pressed();
        } else if (e.code === 'Enter' && state === 'over' && time - overTime > 0.35) {
            e.preventDefault();
            restart();
        }
    });
 
    game.addEventListener('pointerdown', e => {
        if (e.target.closest('button')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        pressed();
    });
 
    // follow the site theme (the toggle adds / removes body.dark-mode)
    function syncTheme() { targetBlend = document.body.classList.contains('dark-mode') ? 1 : 0; }
    new MutationObserver(syncTheme).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    syncTheme();
    blend = targetBlend;
 
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(game);
    else window.addEventListener('resize', resize);
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(entries => { visible = entries[0].isIntersecting; }).observe(game);
    }
 
    best = Number(localStorage.getItem(bestKey()) || 0);
    syncSoundButton();
    renderLeaderboard();
    renderMenu();
    resize();
    bird.y = groundTop() / 2;
    requestAnimationFrame(frame);
})();
    </script>
