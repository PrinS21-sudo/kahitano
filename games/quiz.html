<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game | Prince Kyle G. Basco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/game-style.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
    <link rel="stylesheet" href="../css/portfolio.css">
    <link rel="stylesheet" href="../css/nav-bloom.css">
    <link rel="stylesheet" href="../css/game-themes.css">
</head>
<body class="portfolio-page quiz-page">
    <button class="theme-fab" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="sun-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <header class="header portfolio-page-header portfolio-site-header">
        <a href="index.html#home" class="logo" aria-label="Prince Kyle G. Basco home"><svg class="logo-flower" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 18C16 10 10 8 7 11C4 14 6 20 14 22C7 24 5 30 8 33C11 36 17 33 20 26C23 33 29 36 32 33C35 30 33 24 26 22C34 20 36 14 33 11C30 8 24 10 20 18Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="20" cy="22" r="2.5" fill="currentColor"/></svg><span>PRINS</span></a>
        <nav class="main-nav" aria-label="Main navigation"><a href="index.html#home" class="nav-link">Home</a><a href="games.html" class="nav-link active">Games</a><a href="about.html" class="nav-link">About</a></nav>
        <div class="header-right"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu"><i data-lucide="menu"></i></button></div>
    </header>
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true"><button class="mobile-menu-close" id="menuClose" type="button" aria-label="Close menu"><i data-lucide="x"></i></button><nav aria-label="Mobile navigation"><a href="index.html#home">Home</a><a href="games.html">Games</a><a href="about.html">About</a></nav></div>

    <main class="portfolio-page-main quiz-main">
        <section class="portfolio-page-heading quiz-heading">
            <h1>General knowledge <em>quiz.</em></h1>
            <p>Ten random questions. Three minutes. See what you know.</p>
        </section>
        <div class="quiz-panel">
            <section id="start" class="quiz-start">
                <p>Enter your details to begin your timed quiz.</p>
                <div class="student-fields">
                    <label>Student Name<input type="text" id="studentName" placeholder="Enter your name" required></label>
                    <label>Course / Section<input type="text" id="courseSection" placeholder="e.g. BSCpE 2A" required></label>
                    <label>Date<input type="date" id="quizDate" required></label>
                </div>
                <button type="button" onclick="startQuiz()">Start quiz <span aria-hidden="true">→</span></button>
            </section>
            <section id="quiz">
                <div class="quiz-status"><span class="timer">Time: <span id="time">3:00</span></span><span class="progress" id="progress">Answered: 0 / 10</span></div>
                <div class="quiz-table-wrap"><table><thead><tr><th>No.</th><th>Question</th><th>Your Answer</th></tr></thead><tbody id="questionContainer"></tbody></table></div>
                <button type="button" onclick="checkAnswers()">Finish quiz</button>
            </section>
            <section id="result">
                <h2 id="score"></h2><h3>Answer correction</h3>
                <div class="quiz-table-wrap"><table id="correctionTable"><thead><tr><th>No.</th><th>Question</th><th>Your Answer</th><th>Result</th><th>Correct Answer</th></tr></thead><tbody id="correctionBody"></tbody></table></div>
                <button type="button" id="printBtn" onclick="openPrintModal()">Print result</button>
            </section>
        </div>
        <a href="games.html" class="portfolio-back-link">← Back to all games</a>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/script.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/nav-bloom.js"></script>
</body>
</html>
